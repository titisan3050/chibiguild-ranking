name: ranking

on:
  schedule:
    - cron: "*/5 * * * *"   # 5 分ごと（GitHub の定期実行の最短。混んでいると遅れることがある）
  workflow_dispatch:      # Actions の画面から手で動かすこともできる

permissions:
  contents: write

concurrency:
  group: ranking
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 集計
        env:
          AUTO_URL: ${{ vars.AUTO_URL }}
        run: python3 build_ranking.py
      - name: 変わっていたら保存
        run: |
          git config user.name "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add docs/ranking.txt
          git diff --cached --quiet && exit 0
          git commit -q -m "ランキングを更新"
          # 同時に動いた別の集計と保存がぶつかったら、取り込んでから送り直す（新しい集計結果を優先）
          for i in 1 2 3 4 5; do
            git pull -q --rebase -X theirs origin main && git push -q && exit 0
            sleep 5
          done
          exit 1
