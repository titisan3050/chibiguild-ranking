name: ranking

on:
  schedule:
    - cron: "*/5 * * * *"   # 5 分ごと（GitHub の定期実行の最短。混んでいると遅れることがある）
  workflow_dispatch:      # Actions の画面から手で動かすこともできる

permissions:
  contents: write

concurrency:
  group: ranking
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 集計
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
          FORM_URL: ${{ vars.FORM_URL }}
          AUTO_URL: ${{ vars.AUTO_URL }}
        run: python3 build_ranking.py
      - name: 変わっていたら保存
        run: |
          git config user.name "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add docs/ranking.txt
          git diff --cached --quiet || (git commit -m "ランキングを更新" && git push)
